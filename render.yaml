# Render Blueprint: one free web service built from the Dockerfile.
# Render → New → Blueprint → pick this repository. See docs/DEPLOY.md.
services:
  - type: web
    name: shot-driven-development
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render sets PORT itself; the server reads it.
      - key: DISCONNECT_GRACE_SEC
        value: "60"
      - key: ROOM_IDLE_MIN
        value: "15"
